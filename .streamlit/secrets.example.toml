# Sao chép nội dung này vào phần Secrets của Streamlit Community Cloud.
# Không đổi tên khóa và không commit private_key thật lên GitHub.

project_id = "plasma-renderer-507213-p8"
dataset_id = "grabmart_business"
# Mặc định phải là false trên ứng dụng công khai. Chỉ bật khi đã giới hạn IAM
# và chấp nhận cho ứng dụng đọc các cột an toàn được định nghĩa trong src/data.py.
enable_live_data = false
allowed_emails = ["OWNER_GOOGLE_EMAIL", "LECTURER_GOOGLE_EMAIL"]

# Xác thực Google OIDC. Không commit client_secret hoặc cookie_secret thật.
[auth]
redirect_uri = "https://grabmart-business-copilot.streamlit.app/oauth2callback"
cookie_secret = "GENERATE_A_LONG_RANDOM_SECRET"
client_id = "YOUR_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "YOUR_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[gcp_service_account]
type = "service_account"
project_id = "YOUR_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com"
client_id = "YOUR_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "YOUR_CERT_URL"
